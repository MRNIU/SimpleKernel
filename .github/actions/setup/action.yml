# 公共 setup：Rust 与 Cargo 缓存；系统测试按架构补齐可选依赖。
# 被 workflow.yml 中所有 job 复用。

name: Setup SimpleKernel Build Environment
description: Setup Rust and Cargo cache, optionally install firmware and QEMU dependencies

inputs:
  cache-key-prefix:
    description: Cache key prefix for differentiating job caches
    required: true

  firmware-arch:
    description: Optional firmware and QEMU architecture (riscv64 or aarch64)
    default: ""

runs:
  using: composite
  steps:
    - name: Trust checkout
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup Rust toolchain
      shell: bash
      run: |
        # Dockerfile 通过 ENV 设置了这些路径，但 GitHub Actions container job
        # 可能会覆盖容器环境变量和 PATH，需要手动恢复并传给后续 steps。
        export CARGO_HOME="${CARGO_HOME:-/usr/local/cargo}"
        export RUSTUP_HOME="${RUSTUP_HOME:-/usr/local/rustup}"
        export PATH="$CARGO_HOME/bin:$PATH"
        if ! command -v rustup >/dev/null 2>&1; then
          echo "::error title=Missing Rust toolchain::rustup is required in the selected CI environment."
          exit 1
        fi
        {
          echo "CARGO_HOME=$CARGO_HOME"
          echo "RUSTUP_HOME=$RUSTUP_HOME"
        } >> "$GITHUB_ENV"
        echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
        # 读取 checkout 的 rust-toolchain.toml，旧镜像也能补齐新版本和组件。
        rustup show active-toolchain
        rustc --version

    - name: Cache Cargo
      uses: actions/cache@v6.1.0
      with:
        path: |
          /usr/local/cargo/registry
          /usr/local/cargo/git
        key: ${{ inputs.cache-key-prefix }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.arch }}-

    - name: Install firmware and QEMU dependencies
      if: inputs.firmware-arch != ''
      shell: bash
      env:
        FIRMWARE_ARCH: ${{ inputs.firmware-arch }}
      run: |
        case "$FIRMWARE_ARCH" in
          riscv64) arch_packages=(qemu-system-riscv gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu) ;;
          aarch64) arch_packages=(qemu-system-arm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf) ;;
          *) echo "Unsupported firmware architecture: $FIRMWARE_ARCH" >&2; exit 1 ;;
        esac
        apt-get update
        apt-get install --no-install-recommends -y "${arch_packages[@]}" \
          bc bison flex gawk cpio pkg-config libgnutls28-dev libncurses-dev libssl-dev \
          openssl swig uuid-dev python3 python3-cryptography python3-dev python3-pyelftools \
          python3-setuptools python-is-python3 device-tree-compiler u-boot-tools dosfstools
        mkdir -p /srv/tftp
        git submodule update --init --recursive --depth 1
