#
# 公共 setup composite action：submodule → Rust 工具链 → Cargo 缓存
# 被 workflow.yml 中所有 job 复用。

name: Setup SimpleKernel Build Environment
description: Init submodules, setup repository Rust toolchain, and cache Cargo

inputs:
  cache-key-prefix:
    description: Cache key prefix for differentiating job caches
    required: true

runs:
  using: composite
  steps:
    - name: Shallow submodule init
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git submodule update --init --recursive --depth 1

    - name: Setup Rust toolchain
      shell: bash
      run: |
        # Dockerfile 通过 ENV 设置了这些路径，但 GitHub Actions container job
        # 可能会覆盖容器环境变量和 PATH，需要手动恢复并传给后续 steps。
        export CARGO_HOME="${CARGO_HOME:-/usr/local/cargo}"
        export RUSTUP_HOME="${RUSTUP_HOME:-/usr/local/rustup}"
        export PATH="$CARGO_HOME/bin:$PATH"
        if ! command -v rustup >/dev/null 2>&1; then
          echo "::error title=Missing Rust toolchain::rustup is required in the selected CI environment."
          exit 1
        fi
        {
          echo "CARGO_HOME=$CARGO_HOME"
          echo "RUSTUP_HOME=$RUSTUP_HOME"
        } >> "$GITHUB_ENV"
        echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
        # 读取 checkout 的 rust-toolchain.toml，旧镜像也能补齐新版本和组件。
        rustup show active-toolchain
        rustc --version

    - name: Cache Cargo
      uses: actions/cache@v6.1.0
      with:
        path: |
          /usr/local/cargo/registry
          /usr/local/cargo/git
        key: ${{ inputs.cache-key-prefix }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.arch }}-
