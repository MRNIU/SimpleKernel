#
# 公共 setup composite action：checkout → submodule → Rust 工具链 → Cargo 缓存
# 被 workflow.yml 中所有 job 复用。

name: Setup SimpleKernel Build Environment
description: Checkout, init submodules, setup Rust toolchain, and cache Cargo

inputs:
  cache-key-prefix:
    description: Cache key prefix for differentiating job caches
    required: true

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Shallow submodule init
      shell: bash
      run: |
        git config --global --add safe.directory '*'
        git submodule update --init --recursive --depth 1

    # TODO: 合回 main 后触发 dev-image 重建，届时删除 rustup fallback 安装逻辑
    - name: Setup Rust toolchain
      shell: bash
      run: |
        # Dockerfile 通过 ENV 设置了这些路径，但 GitHub Actions container job
        # 可能会覆盖容器环境变量和 PATH，需要手动恢复并传给后续 steps。
        export CARGO_HOME="${CARGO_HOME:-/usr/local/cargo}"
        export RUSTUP_HOME="${RUSTUP_HOME:-/usr/local/rustup}"
        export PATH="$CARGO_HOME/bin:$PATH"
        if ! command -v rustup &>/dev/null; then
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain none --no-modify-path
        fi
        {
          echo "CARGO_HOME=$CARGO_HOME"
          echo "RUSTUP_HOME=$RUSTUP_HOME"
        } >> "$GITHUB_ENV"
        echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
        rustup show

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ inputs.cache-key-prefix }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.arch }}-
