# Copyright The SimpleKernel Contributors

name: build

on:
  push:
  pull_request:
  release:
    types: [published]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # PR: 3 runs for speed; push/release: 10 runs for stability
  SYSTEM_TEST_RUNS: ${{ github.event_name == 'pull_request' && 3 || 10 }}

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/simple-xx/simplekernel-dev:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            range="HEAD^1..HEAD"
          else
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          fi

          missing=0
          for commit in $(git rev-list --no-merges "$range"); do
            if ! git log -1 --format=%B "$commit" | grep -qi '^Signed-off-by:'; then
              echo "::error title=Missing DCO sign-off::Commit $commit does not contain a Signed-off-by trailer."
              missing=1
            fi
          done

          exit "$missing"

      - uses: ./.github/actions/setup
        with:
          cache-key-prefix: cargo-check

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (riscv64)
        run: cargo clippy --target riscv64gc-unknown-none-elf -- -D warnings

      - name: Clippy (aarch64)
        run: cargo clippy --target aarch64-unknown-none -- -D warnings

      - name: Unit tests (host)
        run: cargo test -p memory_types -p config -p page_table_entry

      - name: Dependency audit
        run: |
          cargo install --locked cargo-deny || true
          cargo deny check

  build:
    needs: check
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/simple-xx/simplekernel-dev:latest
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup
        with:
          cache-key-prefix: cargo-${{ matrix.arch }}

      - name: Build
        run: cargo xtask build --arch ${{ matrix.arch }}

      - name: System Test
        run: |
          for i in $(seq 1 $SYSTEM_TEST_RUNS); do
            echo "=== ${{ matrix.arch }} System Test Run $i/$SYSTEM_TEST_RUNS ==="
            timeout 600 cargo xtask test --arch ${{ matrix.arch }} --all --timeout 120
            echo "${{ matrix.arch }} system test run $i/$SYSTEM_TEST_RUNS passed"
          done
