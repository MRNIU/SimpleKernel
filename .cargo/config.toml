[alias]
xtask = "run --package xtask --"

[target.riscv64gc-unknown-none-elf]
rustflags = [
    "-C", "force-unwind-tables=yes",
    "--cfg", "bare_metal",
    "--cfg", "bare_riscv64",
    "-C", "link-arg=-z",
    "-C", "link-arg=norelro",
    "-C", "link-arg=-Tsrc/arch/riscv64/link.ld",
]

[target.aarch64-unknown-none]
rustflags = [
    "-C", "force-unwind-tables=yes",
    "--cfg", "bare_metal",
    "--cfg", "bare_aarch64",
    "-C", "link-arg=-z",
    "-C", "link-arg=norelro",
    "-C", "link-arg=-Tsrc/arch/aarch64/link.ld",
]
