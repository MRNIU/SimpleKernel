# rust-analyzer 项目级配置（IDE 无关——VS Code / Neovim / Helix / IntelliJ 通用）
#
# 主分析目标为 riscv64 裸机，诊断同时覆盖 aarch64。
# 这保证了在任意宿主机架构（x86_64 / aarch64 / riscv64）上，
# rust-analyzer 的跳转、补全、诊断行为完全一致。

[cargo]
target = "riscv64gc-unknown-none-elf"
buildScripts.enable = true

[check]
targets = [
    "riscv64gc-unknown-none-elf",
    "aarch64-unknown-none-softfloat",
]
extraArgs = [
    "-Z", "build-std=core,compiler_builtins,alloc",
    "-Z", "build-std-features=compiler-builtins-mem",
]

[procMacro]
enable = true
