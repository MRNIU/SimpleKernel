[package]
name = "tlb"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Architecture-independent TLB flush with cross-core shootdown support"
edition.workspace = true

[dependencies]
config = { path = "../config" }
spin.workspace = true

# RISC-V sfence.vma 指令（仅裸机目标）
[target.'cfg(all(target_os = "none", target_arch = "riscv64"))'.dependencies]
riscv.workspace = true

# AArch64 TLBI/DSB/ISB 指令封装（仅裸机目标）
[target.'cfg(all(target_os = "none", target_arch = "aarch64"))'.dependencies]
aarch64-cpu.workspace = true

[lints]
workspace = true
