[package]
name = "memory"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
edition.workspace = true

[dependencies]
config = { path = "../config" }
address = { path = "../address" }
sync_crate = { path = "../sync", package = "sync" }
per-cpu = { path = "../per-cpu" }
page_table_crate = { path = "../page_table", package = "page_table", features = ["test-support"] }

bitflags = "2"
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
buddy_system_allocator = "0.11"
log = { version = "0.4", default-features = false }
spin = { version = "0.9", default-features = false, features = ["once"] }

# RISC-V sfence.vma 指令（TLB 刷新）
[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = { version = "0.16", features = ["s-mode"] }
