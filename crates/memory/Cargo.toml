[package]
name = "memory"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
edition.workspace = true

[dependencies]
config = { path = "../config" }
address = { path = "../address" }
sync_crate = { path = "../sync", package = "sync" }
per_cpu = { path = "../per_cpu" }
page_table_crate = { path = "../page_table", package = "page_table" }
frame_allocator = { path = "../frame_allocator" }
heap_crate = { path = "../heap", package = "heap" }
page_allocator = { path = "../page_allocator" }

bitflags.workspace = true
zerocopy.workspace = true
log.workspace = true
spin.workspace = true

# RISC-V sfence.vma 指令（TLB 刷新）
[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv.workspace = true

[dev-dependencies]
page_table_crate = { path = "../page_table", package = "page_table", features = ["test-support"] }
frame_allocator = { path = "../frame_allocator", features = ["test-support"] }
page_allocator = { path = "../page_allocator", features = ["test-support"] }
