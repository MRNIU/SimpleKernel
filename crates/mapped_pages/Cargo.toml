[package]
name = "mapped_pages"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Move-only VA→PA mapping ownership with RAII cleanup and MMIO support"
edition.workspace = true

[features]
default = []
test-support = ["page_table/test-support", "frame_allocator/test-support"]

[dependencies]
page_table = { path = "../page_table" }
frame_allocator = { path = "../frame_allocator" }
address = { path = "../address" }
config = { path = "../config" }
sync_crate = { path = "../sync", package = "sync" }
tlb = { path = "../tlb" }
zerocopy.workspace = true
log.workspace = true

[dev-dependencies]
page_table = { path = "../page_table", features = ["test-support"] }
frame_allocator = { path = "../frame_allocator", features = ["test-support"] }
