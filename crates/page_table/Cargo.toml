[package]
name = "page_table"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Architecture-independent multi-level page table with generic frame allocation"
edition.workspace = true

[features]
## 测试时使用 AArch64 PTE 编码（默认使用 RISC-V）。
test-aarch64 = []
## 导出 HeapNodeFrame 供下游 crate 测试使用。
test-support = []

[dependencies]
config = { path = "../config" }
address = { path = "../address" }
bitflags = "2"
log = { version = "0.4", default-features = false }
