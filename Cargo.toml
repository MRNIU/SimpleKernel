# SimpleKernel — Rust 版本
#
# 工作区包含两个 crate:
#   - 根 crate: 内核主体 (#![no_std], 交叉编译到 riscv64/aarch64)
#   - xtask:    构建辅助工具 (宿主机运行, 替代 CMake)
#
# 使用方法:
#   cargo build --target targets/riscv64-none.json
#   cargo xtask run --arch riscv64

[workspace]
members = [
    ".",
    "crates/arch",
    "crates/config",
    "crates/span",
    "crates/memory_types",
    "crates/macros",
    "crates/per_cpu",
    "crates/interrupt_state",
    "crates/sync",
    "crates/global_tick",
    "crates/local_tick",

    "crates/frame_allocator",
    "crates/heap",
    "crates/page_table_entry",
    "crates/tlb",
    "crates/paging",
    "crates/memory",
    "crates/test_harness",
    "tests/standalone/panic_test",
    "tests/standalone/frame-alloc-test",
    "tests/standalone/frame-mapped-drop-test",
    "tests/standalone/sync-spinlock-test",
    "tests/standalone/sync-recursive-lock-test",
    "tests/standalone/sync-lockstack-test",
    "tests/standalone/sync-lockstack-pop-mismatch-test",
    "tests/standalone/paging-basic-test",
    "tests/standalone/paging-table-test",
    "tests/standalone/paging-mapping-test",
    "tests/standalone/paging-equal-range-panic-test",
    "tests/standalone/paging-reversed-range-panic-test",
    "tests/standalone/paging-conflict-panic-test",
    "tests/standalone/vma-test",
    "tests/standalone/heap-test",
    "tests/standalone/device-test",
    "tests/standalone/fs-test",
    "xtask",
]
default-members = ["."]
resolver = "2"

# ── workspace 级依赖版本管理 ──────────────────────────────────────
# 各 crate 通过 `dep.workspace = true` 引用，避免版本漂移
[workspace.dependencies]
# 同步 / 单例
spin = { version = "0.10", default-features = false, features = ["once"] }

# 位操作
bitflags = "2"
bitfield-struct = "0.12"              # 过程宏位域结构体（硬件寄存器字段）

# 日志
log = { version = "0.4", default-features = false }

# 内存分配
buddy_system_allocator = "0.12"

# 无堆数据结构
heapless = "0.8"                      # 固定容量 Vec/String/Queue（无需堆分配）
hashbrown = { version = "0.15", default-features = false, features = ["allocator-api2"] }
intrusive-collections = { version = "0.10", default-features = false }

# 零拷贝序列化
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }

# ELF / 符号
elf = { version = "0.8", default-features = false }
rustc-demangle = { version = "0.1", default-features = false }

# DWARF 回溯
unwinding = { version = "0.2", default-features = false, features = [
    "unwinder", "fde-static", "dwarf-expr", "hide-trace",
] }

# 设备树
fdt = "0.2.0-alpha1"

# 调试 / 测试
gdbstub = { version = "0.7", default-features = false }   # 内核内嵌 GDB server
qemu-exit = "3"                        # 用指定退出码结束 QEMU（集成测试）

# VirtIO 驱动框架（P6 设备框架阶段启用）
virtio-drivers = { version = "0.13", default-features = false }

# FAT 文件系统（P7 文件系统阶段启用）
fatfs = { git = "https://github.com/rafalh/rust-fatfs", default-features = false, features = ["alloc", "lfn"] }

# 网络协议栈（P7+ 网络子系统阶段启用）
smoltcp = { version = "0.13", default-features = false, features = [
    "medium-ip", "proto-ipv4", "socket-tcp", "socket-udp",
] }

# RISC-V
sbi-rt = { version = "0.0.3", features = ["legacy"] }
riscv = { version = "0.16", features = ["s-mode"] }

# AArch64
# TODO: aarch64-cpu 使用 git 依赖以获取 DAIFSet/DAIFClr 支持，待包含此功能的新版本
#       发布到 crates.io 后切换回版本依赖
# 当前使用 fork 分支以测试 TLBI 指令封装（PR: rust-embedded/aarch64-cpu#77）
aarch64-cpu = { git = "https://github.com/MRNIU/aarch64-cpu", branch = "feat/add-tlbi-instructions" }
tock-registers = "0.10"
arm-gic = "0.8"
arm-psci = "0.2"

# 构建
cc = "1"

# 过程宏基础
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# 版权信息集中在 workspace 级别，各 crate 通过 `key.workspace = true` 继承
[workspace.package]
version = "0.1.0"
authors = ["MRNIU <nzh@nzhnb.com>"]
license = "MIT"
repository = "https://github.com/Simple-XX/SimpleKernel"
description = "Interface-driven OS kernel for AI-assisted learning (Rust edition)"
edition = "2024"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(bare_metal)',
    'cfg(bare_riscv64)',
    'cfg(bare_aarch64)',
] }

# --- 内核 crate（原 kernel/Cargo.toml） ---

[package]
name = "simplekernel"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
edition.workspace = true
build = "build.rs"                    # 编译汇编文件 (.S) 和链接脚本

[features]
default = ["lang_items"]
# 提供 #[panic_handler] 和 #[alloc_error_handler]。
# 当 simplekernel 作为库被其他二进制（如独立测试）依赖时，
# 关闭此 feature 以允许调用方自行定义这些 lang items。
lang_items = []

# 二进制入口仅面向裸机目标，不参与宿主机测试
[[bin]]
name = "simplekernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# --- 内部 crate ---
config = { path = "crates/config" }
memory_types = { path = "crates/memory_types" }
per_cpu = { path = "crates/per_cpu" }
interrupt_state = { path = "crates/interrupt_state" }
sync = { path = "crates/sync" }
global_tick = { path = "crates/global_tick" }
local_tick = { path = "crates/local_tick" }
heap = { path = "crates/heap" }
paging = { path = "crates/paging" }
memory = { path = "crates/memory" }

# --- 同步 ---
# spin: 仅用于 Once<T> 单例初始化, 自定义 SpinLock 在 sync/spinlock.rs 中
spin.workspace = true

# --- 位操作 ---
bitflags.workspace = true             # 类型安全的位标志（寄存器字段、页表项）
bitfield-struct.workspace = true      # 过程宏位域结构体（硬件寄存器字段定义）

# --- 日志 ---
log.workspace = true                  # 日志门面, 后端在 logging.rs

# --- 内存 ---
buddy_system_allocator.workspace = true  # buddy system 堆分配器, 实现 GlobalAlloc trait

# --- 无堆数据结构 ---
heapless.workspace = true             # 固定容量 Vec/String/Queue，中断上下文安全
hashbrown.workspace = true            # no_std HashMap，O(1) 查找（task_table 等）
intrusive-collections.workspace = true  # 侵入式链表/红黑树（调度器队列、等待队列）

# --- ELF 解析 ---
elf.workspace = true                  # 零拷贝 ELF 解析 (no_std)

# --- 符号解码 ---
rustc-demangle.workspace = true

# --- DWARF 回溯 ---
unwinding.workspace = true

# --- 设备树 ---
fdt.workspace = true                  # 纯 Rust FDT 解析器 (no_std)

# --- 调试 / 测试 ---
gdbstub.workspace = true              # 内核内嵌 GDB server（QEMU 外也能调试）
qemu-exit.workspace = true            # 用指定退出码结束 QEMU（集成测试）

# --- VirtIO ---
virtio-drivers.workspace = true       # VirtIO 协议栈（blk/net/console/gpu）

# --- FAT 文件系统 ---
fatfs.workspace = true                # FAT12/16/32 纯 Rust 实现（no_std）

# --- 网络 ---
smoltcp.workspace = true              # 轻量 TCP/IP 协议栈（无 alloc）

# --- RISC-V 架构专用（仅裸机目标） ---
[target.'cfg(all(target_os = "none", target_arch = "riscv64"))'.dependencies]
sbi-rt.workspace = true               # SBI 运行时接口
riscv.workspace = true                # CSR 访问、S-mode 支持

# --- AArch64 架构专用（仅裸机目标） ---
[target.'cfg(all(target_os = "none", target_arch = "aarch64"))'.dependencies]
aarch64-cpu.workspace = true          # 系统寄存器访问
tock-registers.workspace = true       # 类型安全的 MMIO 寄存器抽象
arm-gic.workspace = true              # GICv3 驱动（Arm Trusted Firmware 官方）
arm-psci.workspace = true             # PSCI 电源管理接口（CPU on/off/reset）

# --- 构建依赖 ---
[build-dependencies]
cc.workspace = true                   # 编译由 GCC 预处理的汇编 (.S) 文件

[lints]
workspace = true

# 内核即使在 debug 模式下也需要一定的优化，否则生成的代码过大
[profile.dev]
panic = "abort"       # 内核不支持 unwind
opt-level = 1         # 最小优化（保留调试信息的同时减少代码体积）

[profile.release]
panic = "abort"
lto = true            # 跨 crate 链接时优化 — 减少二进制体积
codegen-units = 1     # 单编译单元 — 最大优化效果
